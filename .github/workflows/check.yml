name: Offline checks
permissions:
  contents: read
on:
  push:
  pull_request:
concurrency:
  group: offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Cache Nix environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('default.nix', 'pyproject.toml', 'uv.lock') }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Cargo dependencies and build artifacts
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: cargo-check-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('default.nix') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-check-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('default.nix') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            cargo-check-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('default.nix') }}-
      - name: Format, full-feature Clippy and non-inference contracts
        run: nix shell -f default.nix scripts.loupe-check --command loupe-check -- --workspace --all-features -- --test-threads=1
      - name: Save Cargo dependencies and build artifacts
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Regenerate pinned encoder fixtures
        run: |
          nix shell -f default.nix scripts.loupe-golden --command loupe-golden -- --out /tmp/loupe-golden
          diff -r evals/golden/clef-v1 /tmp/loupe-golden
