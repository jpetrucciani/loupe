[workspace]
members = ["crates/loupe-core", "crates/loupe-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Jacobi Petrucciani"]
repository = "https://github.com/jpetrucciani/loupe"
publish = false

[workspace.dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
semver = "=1.0.28"
parquet = { version = "=60.0.0", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
csv = "1.4.0"
regex = "1.13.1"
redb = "4.3.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
futures = "0.3.34"
hf-hub = "1.0.0"
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "sync", "time", "signal", "process", "net"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
toml = { version = "1.1.6", features = ["preserve_order"] }
tempfile = "3.27.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
