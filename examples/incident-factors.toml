name = "incident-factors"
version = 1
type = "noul"
instructions = "Does this describe an unresolved service incident?"

[[factors]]
id = "customer_impact"
weight = 3
instructions = "Does this explicitly say customers cannot use the service?"

[[factors]]
id = "scope"
type = "score"
weight = 2
instructions = "How broad is the reported service impact?"
criteria = ["No impact", "Some customers", "All customers"]

[[factors]]
id = "recovered"
weight = 1
invert = true
instructions = "Does this explicitly say the service recovered or a retry succeeded?"

[factors.policy]
threshold = 0.7
margin = 0.05
